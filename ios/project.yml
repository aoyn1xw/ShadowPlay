name: ShadowPlay
options:
  bundleIdPrefix: io.shadowplay
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "16.0"

settings:
  base:
    # Valid SWIFT_VERSION values are major-mode numbers (4.0/4.2/5.0/6.0).
    # "5.0" means "latest Swift 5 language mode", which this code targets.
    SWIFT_VERSION: "5.0"

targets:
  ShadowPlay:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: ShadowPlay
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.shadowplay.mobile
        # Pin the product name instead of relying on $(TARGET_NAME) default
        # resolution: an unresolved PRODUCT_NAME yields a literal ".app"
        # product, which fails archives with
        # "Multiple commands produce '.../Applications/.app'".
        PRODUCT_NAME: ShadowPlay
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: ShadowPlay/Info.plist
      properties:
        CFBundleDisplayName: ShadowPlay
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Camera is used only to scan the desktop app's pairing QR code.
        NSCameraUsageDescription: "ShadowPlay uses the camera to scan the pairing QR code shown by the desktop app."
        # Required since iOS 14 so the OS shows the local-network permission prompt.
        NSLocalNetworkUsageDescription: "ShadowPlay connects to your PC over your Wi-Fi network to list and download your game clips."
        # The desktop MVP speaks plain HTTP on the LAN. Scoped strictly to local networking;
        # see docs/IOS_HANDOFF.md for the pinned-HTTPS roadmap.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Expose the Documents folder in Files/Finder so downloaded clips are reachable.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true

schemes:
  ShadowPlay:
    build:
      targets:
        ShadowPlay: all
    run:
      config: Debug
    archive:
      config: Release

name: iOS Signed Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "flutter/**"
      - ".github/workflows/ios-build.yml"

concurrency:
  group: ios-signed-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-ios:
    name: Build signed iOS IPA
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true

      - name: Install signing files
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISION_BASE64: ${{ secrets.PROVISION_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "${P12_BASE64:-}" ]; then
            echo "::error::P12_BASE64 is missing"
            exit 1
          fi

          if [ -z "${P12_PASSWORD:-}" ]; then
            echo "::error::P12_PASSWORD is missing"
            exit 1
          fi

          if [ -z "${PROVISION_BASE64:-}" ]; then
            echo "::error::PROVISION_BASE64 is missing"
            exit 1
          fi

          CERTIFICATE_PATH="$RUNNER_TEMP/original.p12"
          NORMALIZED_P12="$RUNNER_TEMP/signing.p12"
          CERTIFICATE_PEM="$RUNNER_TEMP/signing.pem"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          EXPORT_OPTIONS="$RUNNER_TEMP/ExportOptions.plist"

          export CERTIFICATE_PATH
          export PROFILE_PATH
          export P12_BASE64
          export PROVISION_BASE64

          python3 <<'PY'
          import base64
          import os

          p12 = base64.b64decode(os.environ["P12_BASE64"].strip())
          profile = base64.b64decode(os.environ["PROVISION_BASE64"].strip())

          with open(os.environ["CERTIFICATE_PATH"], "wb") as f:
              f.write(p12)

          with open(os.environ["PROFILE_PATH"], "wb") as f:
              f.write(profile)
          PY

          echo "Decoded P12 size:"
          wc -c "$CERTIFICATE_PATH"

          echo "Decoded provisioning profile size:"
          wc -c "$PROFILE_PATH"

          if [ ! -s "$CERTIFICATE_PATH" ]; then
            echo "::error::Decoded P12 is empty"
            exit 1
          fi

          if [ ! -s "$PROFILE_PATH" ]; then
            echo "::error::Decoded provisioning profile is empty"
            exit 1
          fi

          echo "Checking PKCS12..."

          if openssl pkcs12 \
            -in "$CERTIFICATE_PATH" \
            -passin "pass:$P12_PASSWORD" \
            -info \
            -noout
          then
            PKCS12_LEGACY=""
          else
            echo "Normal PKCS12 parsing failed, trying legacy mode..."

            openssl pkcs12 \
              -legacy \
              -in "$CERTIFICATE_PATH" \
              -passin "pass:$P12_PASSWORD" \
              -info \
              -noout

            PKCS12_LEGACY="-legacy"
          fi

          echo "Extracting and normalizing certificate..."

          openssl pkcs12 \
            $PKCS12_LEGACY \
            -in "$CERTIFICATE_PATH" \
            -passin "pass:$P12_PASSWORD" \
            -nodes \
            -out "$CERTIFICATE_PEM"

          openssl pkcs12 \
            -export \
            -in "$CERTIFICATE_PEM" \
            -out "$NORMALIZED_P12" \
            -passout "pass:$P12_PASSWORD"

          echo "Creating temporary keychain..."

          security create-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security set-keychain-settings \
            -lut 21600 \
            "$KEYCHAIN_PATH"

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          echo "Importing signing identity..."

          security import "$NORMALIZED_P12" \
            -k "$KEYCHAIN_PATH" \
            -P "$P12_PASSWORD" \
            -A

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security list-keychains \
            -d user \
            -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          security default-keychain \
            -d user \
            -s "$KEYCHAIN_PATH"

          echo "Available signing identities:"
          security find-identity \
            -v \
            -p codesigning \
            "$KEYCHAIN_PATH"

          IDENTITY_COUNT="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -c '"Apple Distribution:' || true)"

          if [ "$IDENTITY_COUNT" -lt 1 ]; then
            echo "::error::No Apple Distribution signing identity was imported"
            exit 1
          fi

          echo "Decoding provisioning profile..."

          security cms \
            -D \
            -i "$PROFILE_PATH" \
            > "$PROFILE_PLIST"

          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c "Print :UUID" "$PROFILE_PLIST")"
          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c "Print :Name" "$PROFILE_PLIST")"
          TEAM_ID="$(/usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" "$PROFILE_PLIST")"
          APPLICATION_IDENTIFIER="$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" "$PROFILE_PLIST")"

          BUNDLE_ID="${APPLICATION_IDENTIFIER#${TEAM_ID}.}"

          echo "Profile UUID: $PROFILE_UUID"
          echo "Profile name: $PROFILE_NAME"
          echo "Team ID: $TEAM_ID"
          echo "Bundle ID: $BUNDLE_ID"

          if [ -z "$PROFILE_UUID" ] || \
             [ -z "$PROFILE_NAME" ] || \
             [ -z "$TEAM_ID" ] || \
             [ -z "$BUNDLE_ID" ]; then
            echo "::error::Could not read required provisioning profile information"
            exit 1
          fi

          GET_TASK_ALLOW="$(/usr/libexec/PlistBuddy -c "Print :Entitlements:get-task-allow" "$PROFILE_PLIST" 2>/dev/null || echo false)"
          PROVISIONS_ALL_DEVICES="$(/usr/libexec/PlistBuddy -c "Print :ProvisionsAllDevices" "$PROFILE_PLIST" 2>/dev/null || echo false)"

          if [ "$PROVISIONS_ALL_DEVICES" = "true" ]; then
            EXPORT_METHOD="enterprise"
          elif [ "$GET_TASK_ALLOW" = "true" ]; then
            EXPORT_METHOD="development"
          elif /usr/libexec/PlistBuddy -c "Print :ProvisionedDevices:0" "$PROFILE_PLIST" >/dev/null 2>&1; then
            EXPORT_METHOD="ad-hoc"
          else
            EXPORT_METHOD="app-store-connect"
          fi

          echo "Export method: $EXPORT_METHOD"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

          cp "$PROFILE_PATH" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          cat > "$EXPORT_OPTIONS" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>$EXPORT_METHOD</string>

              <key>teamID</key>
              <string>$TEAM_ID</string>

              <key>signingStyle</key>
              <string>manual</string>

              <key>signingCertificate</key>
              <string>Apple Distribution</string>

              <key>provisioningProfiles</key>
              <dict>
                  <key>$BUNDLE_ID</key>
                  <string>$PROFILE_NAME</string>
              </dict>

              <key>stripSwiftSymbols</key>
              <true/>
          </dict>
          </plist>
          EOF

          echo "EXPORT_OPTIONS=$EXPORT_OPTIONS" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"
          echo "BUNDLE_ID=$BUNDLE_ID" >> "$GITHUB_ENV"
          echo "EXPORT_METHOD=$EXPORT_METHOD" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

          rm -f "$CERTIFICATE_PEM"
          rm -f "$CERTIFICATE_PATH"

      - name: Show signing configuration
        run: |
          echo "Team: $TEAM_ID"
          echo "Bundle: $BUNDLE_ID"
          echo "Profile: $PROFILE_NAME"
          echo "Profile UUID: $PROFILE_UUID"
          echo "Export method: $EXPORT_METHOD"

          plutil -lint "$EXPORT_OPTIONS"

      - name: Precache iOS
        working-directory: flutter
        run: flutter precache --ios

      - name: Resolve dependencies
        working-directory: flutter
        run: flutter pub get

      - name: Analyze
        working-directory: flutter
        run: flutter analyze

      - name: Test
        working-directory: flutter
        run: flutter test

      - name: Build signed IPA
        working-directory: flutter
        run: |
          flutter build ipa \
            --release \
            --export-options-plist="$EXPORT_OPTIONS"

      - name: Find IPA
        run: |
          set -euo pipefail

          IPA_FILE="$(find flutter/build/ios/ipa -type f -name "*.ipa" | head -n 1)"

          if [ -z "$IPA_FILE" ]; then
            echo "::error::No IPA was produced"
            find flutter/build/ios -maxdepth 5 -type f || true
            exit 1
          fi

          mkdir -p output
          cp "$IPA_FILE" output/ShadowPlay-signed.ipa

          ls -lh output/ShadowPlay-signed.ipa

      - name: Upload signed IPA
        uses: actions/upload-artifact@v4
        with:
          name: ShadowPlay-signed-iOS
          path: output/ShadowPlay-signed.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Clean up signing files
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi

          rm -f "$RUNNER_TEMP/original.p12"
          rm -f "$RUNNER_TEMP/signing.p12"
          rm -f "$RUNNER_TEMP/signing.pem"
          rm -f "$RUNNER_TEMP/profile.mobileprovision"
          rm -f "$RUNNER_TEMP/profile.plist"
          rm -f "$RUNNER_TEMP/ExportOptions.plist"
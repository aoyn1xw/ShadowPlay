name: iOS Signed OTA Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "flutter/**"
      - ".github/workflows/ios-build.yml"

concurrency:
  group: ios-signed-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-ios:
    name: Build signed iOS OTA IPA
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true

      - name: Install signing files
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISION_BASE64: ${{ secrets.PROVISION_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "${P12_BASE64:-}" ]; then
            echo "::error::P12_BASE64 is missing"
            exit 1
          fi

          if [ -z "${P12_PASSWORD:-}" ]; then
            echo "::error::P12_PASSWORD is missing"
            exit 1
          fi

          if [ -z "${PROVISION_BASE64:-}" ]; then
            echo "::error::PROVISION_BASE64 is missing"
            exit 1
          fi

          CERTIFICATE_PATH="$RUNNER_TEMP/original.p12"
          NORMALIZED_P12="$RUNNER_TEMP/signing.p12"
          CERTIFICATE_PEM="$RUNNER_TEMP/signing.pem"

          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"

          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"

          EXPORT_OPTIONS="$RUNNER_TEMP/ExportOptions.plist"
          ARCHIVE_PATH="$RUNNER_TEMP/ShadowPlay.xcarchive"
          EXPORT_PATH="$RUNNER_TEMP/export"

          export CERTIFICATE_PATH
          export PROFILE_PATH
          export P12_BASE64
          export PROVISION_BASE64

          python3 <<'PY'
          import base64
          import os

          with open(os.environ["CERTIFICATE_PATH"], "wb") as f:
              f.write(base64.b64decode(os.environ["P12_BASE64"].strip()))

          with open(os.environ["PROFILE_PATH"], "wb") as f:
              f.write(base64.b64decode(os.environ["PROVISION_BASE64"].strip()))
          PY

          echo "Decoded P12 size:"
          wc -c "$CERTIFICATE_PATH"

          echo "Decoded provisioning profile size:"
          wc -c "$PROFILE_PATH"

          if [ ! -s "$CERTIFICATE_PATH" ]; then
            echo "::error::Decoded certificate is empty"
            exit 1
          fi

          if [ ! -s "$PROFILE_PATH" ]; then
            echo "::error::Decoded provisioning profile is empty"
            exit 1
          fi

          if openssl pkcs12 \
            -in "$CERTIFICATE_PATH" \
            -passin "pass:$P12_PASSWORD" \
            -info \
            -noout
          then
            PKCS12_LEGACY=""
          else
            echo "Trying PKCS12 legacy mode"

            openssl pkcs12 \
              -legacy \
              -in "$CERTIFICATE_PATH" \
              -passin "pass:$P12_PASSWORD" \
              -info \
              -noout

            PKCS12_LEGACY="-legacy"
          fi

          openssl pkcs12 \
            $PKCS12_LEGACY \
            -in "$CERTIFICATE_PATH" \
            -passin "pass:$P12_PASSWORD" \
            -nodes \
            -out "$CERTIFICATE_PEM"

          openssl pkcs12 \
            -export \
            -in "$CERTIFICATE_PEM" \
            -out "$NORMALIZED_P12" \
            -passout "pass:$P12_PASSWORD"

          security create-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security set-keychain-settings \
            -lut 21600 \
            "$KEYCHAIN_PATH"

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security import "$NORMALIZED_P12" \
            -k "$KEYCHAIN_PATH" \
            -P "$P12_PASSWORD" \
            -A

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security list-keychains \
            -d user \
            -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          security default-keychain \
            -d user \
            -s "$KEYCHAIN_PATH"

          echo "Installed signing identities:"

          security find-identity \
            -v \
            -p codesigning \
            "$KEYCHAIN_PATH"

          CERT_SHA="$(
            security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep '"Apple Distribution:' \
            | head -n 1 \
            | awk '{print $2}'
          )"

          if [ -z "$CERT_SHA" ]; then
            echo "::error::Apple Distribution identity was not found"
            exit 1
          fi

          security cms \
            -D \
            -i "$PROFILE_PATH" \
            > "$PROFILE_PLIST"

          PROFILE_UUID="$(
            /usr/libexec/PlistBuddy \
              -c "Print :UUID" \
              "$PROFILE_PLIST"
          )"

          PROFILE_NAME="$(
            /usr/libexec/PlistBuddy \
              -c "Print :Name" \
              "$PROFILE_PLIST"
          )"

          TEAM_ID="$(
            /usr/libexec/PlistBuddy \
              -c "Print :TeamIdentifier:0" \
              "$PROFILE_PLIST"
          )"

          APPLICATION_IDENTIFIER="$(
            /usr/libexec/PlistBuddy \
              -c "Print :Entitlements:application-identifier" \
              "$PROFILE_PLIST"
          )"

          BUNDLE_ID="${APPLICATION_IDENTIFIER#${TEAM_ID}.}"

          echo "Profile UUID: $PROFILE_UUID"
          echo "Profile name: $PROFILE_NAME"
          echo "Team ID: $TEAM_ID"
          echo "Bundle ID: $BUNDLE_ID"
          echo "Certificate SHA: $CERT_SHA"

          if [ -z "$PROFILE_UUID" ] || \
             [ -z "$PROFILE_NAME" ] || \
             [ -z "$TEAM_ID" ] || \
             [ -z "$BUNDLE_ID" ]; then
            echo "::error::Provisioning profile metadata is incomplete"
            exit 1
          fi

          if [ "$BUNDLE_ID" != "app.winter6686.date9988" ]; then
            echo "::error::Provisioning profile bundle ID does not match the app"
            exit 1
          fi

          if ! /usr/libexec/PlistBuddy \
            -c "Print :ProvisionedDevices:0" \
            "$PROFILE_PLIST" \
            >/dev/null 2>&1
          then
            echo "::error::This does not appear to be an Ad Hoc provisioning profile"
            exit 1
          fi

          mkdir -p \
            "$HOME/Library/MobileDevice/Provisioning Profiles"

          cp "$PROFILE_PATH" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          cat > "$EXPORT_OPTIONS" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>ad-hoc</string>

              <key>teamID</key>
              <string>$TEAM_ID</string>

              <key>signingStyle</key>
              <string>manual</string>

              <key>signingCertificate</key>
              <string>$CERT_SHA</string>

              <key>provisioningProfiles</key>
              <dict>
                  <key>$BUNDLE_ID</key>
                  <string>$PROFILE_NAME</string>
              </dict>

              <key>stripSwiftSymbols</key>
              <true/>
          </dict>
          </plist>
          EOF

          plutil -lint "$EXPORT_OPTIONS"

          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"
          echo "BUNDLE_ID=$BUNDLE_ID" >> "$GITHUB_ENV"
          echo "CERT_SHA=$CERT_SHA" >> "$GITHUB_ENV"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "EXPORT_OPTIONS=$EXPORT_OPTIONS" >> "$GITHUB_ENV"
          echo "ARCHIVE_PATH=$ARCHIVE_PATH" >> "$GITHUB_ENV"
          echo "EXPORT_PATH=$EXPORT_PATH" >> "$GITHUB_ENV"

          rm -f "$CERTIFICATE_PEM"
          rm -f "$CERTIFICATE_PATH"

      - name: Resolve dependencies
        working-directory: flutter
        run: flutter pub get

      - name: Analyze
        working-directory: flutter
        run: flutter analyze

      - name: Test
        working-directory: flutter
        run: flutter test

      - name: Prepare Flutter iOS build
        working-directory: flutter
        run: |
          set -euo pipefail

          flutter build ios \
            --release \
            --no-codesign

      - name: Archive signed iOS app
        working-directory: flutter/ios
        run: |
          set -euo pipefail

          rm -rf "$ARCHIVE_PATH"

          xcodebuild \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE_PATH" \
            archive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$CERT_SHA" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            PROVISIONING_PROFILE="$PROFILE_UUID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH"

      - name: Verify signed archive
        run: |
          set -euo pipefail

          APP_PATH="$ARCHIVE_PATH/Products/Applications/Runner.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "::error::Runner.app was not created"
            exit 1
          fi

          echo "Code signature:"

          codesign \
            -dvvv \
            "$APP_PATH" \
            2>&1 \
            | grep -E \
              "Identifier=|Authority=|TeamIdentifier="

          if [ ! -f "$APP_PATH/embedded.mobileprovision" ]; then
            echo "::error::Archive has no embedded provisioning profile"
            exit 1
          fi

          security cms \
            -D \
            -i "$APP_PATH/embedded.mobileprovision" \
            > "$RUNNER_TEMP/embedded-profile.plist"

          EMBEDDED_UUID="$(
            /usr/libexec/PlistBuddy \
              -c "Print :UUID" \
              "$RUNNER_TEMP/embedded-profile.plist"
          )"

          echo "Embedded profile UUID: $EMBEDDED_UUID"

          if [ "$EMBEDDED_UUID" != "$PROFILE_UUID" ]; then
            echo "::error::Wrong provisioning profile was embedded"
            exit 1
          fi

      - name: Export signed IPA
        run: |
          set -euo pipefail

          rm -rf "$EXPORT_PATH"
          mkdir -p "$EXPORT_PATH"

          xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$EXPORT_OPTIONS"

      - name: Stage IPA
        run: |
          set -euo pipefail

          IPA_FILE="$(
            find "$EXPORT_PATH" \
              -type f \
              -name "*.ipa" \
              | head -n 1
          )"

          if [ -z "$IPA_FILE" ]; then
            echo "::error::No IPA was produced"
            find "$EXPORT_PATH" -maxdepth 3 -type f || true
            exit 1
          fi

          mkdir -p output

          cp "$IPA_FILE" \
            output/ShadowPlay.ipa

          echo "Signed IPA:"
          ls -lh output/ShadowPlay.ipa

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShadowPlay-signed-iOS
          path: output/ShadowPlay.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Publish latest OTA release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if gh release view latest >/dev/null 2>&1; then
            echo "Updating existing latest release"
          else
            gh release create latest \
              --title "ShadowPlay iOS OTA" \
              --notes "Latest signed ShadowPlay iOS OTA build." \
              --target "$GITHUB_SHA"
          fi

          gh release upload latest \
            output/ShadowPlay.ipa \
            --clobber

      - name: Generate OTA manifest
        run: |
          set -euo pipefail

          mkdir -p docs

          APP_VERSION="$(
            grep '^version:' flutter/pubspec.yaml \
            | head -n 1 \
            | awk '{print $2}' \
            | cut -d '+' -f 1
          )"

          BUILD_NUMBER="$(
            grep '^version:' flutter/pubspec.yaml \
            | head -n 1 \
            | awk '{print $2}' \
            | awk -F '+' '{print $2}'
          )"

          if [ -z "$APP_VERSION" ]; then
            APP_VERSION="1.0.0"
          fi

          if [ -z "$BUILD_NUMBER" ] || \
             [ "$BUILD_NUMBER" = "$APP_VERSION" ]; then
            BUILD_NUMBER="1"
          fi

          cat > docs/manifest.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>items</key>
              <array>
                  <dict>
                      <key>assets</key>
                      <array>
                          <dict>
                              <key>kind</key>
                              <string>software-package</string>

                              <key>url</key>
                              <string>https://github.com/aoyn1xw/ShadowPlay/releases/download/latest/ShadowPlay.ipa</string>
                          </dict>
                      </array>

                      <key>metadata</key>
                      <dict>
                          <key>bundle-identifier</key>
                          <string>$BUNDLE_ID</string>

                          <key>bundle-version</key>
                          <string>$BUILD_NUMBER</string>

                          <key>kind</key>
                          <string>software</string>

                          <key>title</key>
                          <string>ShadowPlay</string>
                      </dict>
                  </dict>
              </array>
          </dict>
          </plist>
          EOF

          plutil -lint docs/manifest.plist

          echo "OTA app version: $APP_VERSION"
          echo "OTA build number: $BUILD_NUMBER"

      - name: Publish updated OTA manifest
        run: |
          set -euo pipefail

          if git diff --quiet -- docs/manifest.plist; then
            echo "Manifest already up to date"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/manifest.plist

          git commit \
            -m "chore: update iOS OTA manifest"

          git push

      - name: Verify OTA URLs
        run: |
          echo "Install page:"
          echo "https://aoyn1xw.github.io/ShadowPlay/"

          echo "Manifest:"
          echo "https://aoyn1xw.github.io/ShadowPlay/manifest.plist"

          echo "IPA:"
          echo "https://github.com/aoyn1xw/ShadowPlay/releases/download/latest/ShadowPlay.ipa"

      - name: Clean up signing files
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ] && \
             [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain \
              "$KEYCHAIN_PATH" \
              || true
          fi

          rm -f "$RUNNER_TEMP/original.p12"
          rm -f "$RUNNER_TEMP/signing.p12"
          rm -f "$RUNNER_TEMP/signing.pem"
          rm -f "$RUNNER_TEMP/profile.mobileprovision"
          rm -f "$RUNNER_TEMP/profile.plist"
          rm -f "$RUNNER_TEMP/embedded-profile.plist"
          rm -f "$RUNNER_TEMP/ExportOptions.plist"
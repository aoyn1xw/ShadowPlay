name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  windows:
    name: Windows release
    runs-on: windows-latest
    outputs:
      version: ${{ steps.release_version.outputs.version }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Resolve release version
        id: release_version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            if ($env:GITHUB_REF_NAME -notmatch '^v(?<version>\d+\.\d+\.\d+)$') {
              throw "Release tags must use the format vMAJOR.MINOR.PATCH (for example, v1.2.3)."
            }

            $version = $Matches.version
          } else {
            [xml] $props = Get-Content -Raw "Directory.Build.props"
            $version = [string] $props.Project.PropertyGroup.Version

            if ($version -notmatch '^\d+\.\d+\.\d+$') {
              throw "Directory.Build.props must contain a numeric MAJOR.MINOR.PATCH Version."
            }
          }

          "SHADOWPLAY_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Restore
        run: >
          dotnet restore
          src/ShadowPlay.Windows/ShadowPlay.Windows.csproj
          -r win-x64

      - name: Build and publish Windows x64
        run: >
          dotnet publish
          src/ShadowPlay.Windows/ShadowPlay.Windows.csproj
          -c Release
          -r win-x64
          --self-contained true
          --no-restore
          -p:Version=$env:SHADOWPLAY_VERSION
          -o publish/win-x64

      - name: Compile Windows installer
        shell: pwsh
        run: |
          $iscc = @(
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1

          if (-not $iscc) {
            throw "Inno Setup Compiler (ISCC.exe) was not found on the runner."
          }

          & $iscc "/DMyAppVersion=$env:SHADOWPLAY_VERSION" "installer\ShadowPlay.iss"

          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE."
          }

      - name: Verify Windows installer
        shell: pwsh
        run: |
          $installer = "artifacts\installer\ShadowPlay-Setup-$env:SHADOWPLAY_VERSION.exe"
          $publishedExe = "publish\win-x64\ShadowPlay.exe"

          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) {
            throw "Expected installer was not created: $installer"
          }

          foreach ($requiredFile in @($publishedExe, "publish\win-x64\coreclr.dll", "publish\win-x64\hostfxr.dll")) {
            if (-not (Test-Path -LiteralPath $requiredFile -PathType Leaf)) {
              throw "Self-contained publish file is missing: $requiredFile"
            }
          }

          $file = Get-Item -LiteralPath $installer
          if ($file.Length -le 0) {
            throw "Installer is empty: $installer"
          }

          $appVersion = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($publishedExe).ProductVersion.Trim()
          $installerVersion = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($installer).ProductVersion.Trim()

          if (-not $appVersion.StartsWith($env:SHADOWPLAY_VERSION, [StringComparison]::Ordinal)) {
            throw "Published app version '$appVersion' does not match '$env:SHADOWPLAY_VERSION'."
          }

          if ($installerVersion -ne $env:SHADOWPLAY_VERSION) {
            throw "Installer version '$installerVersion' does not match '$env:SHADOWPLAY_VERSION'."
          }

          Write-Host "Verified installer: $($file.Name) ($($file.Length) bytes), version $installerVersion"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: ShadowPlay-Windows-installer
          path: artifacts/installer/ShadowPlay-Setup-*.exe
          if-no-files-found: error

  android:
    name: Android release
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: flutter

    steps:
      - uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true

      - name: Precache Android artifacts
        run: flutter precache --android

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload Android build
        uses: actions/upload-artifact@v7
        with:
          name: release-android
          path: flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  publish:
    name: Publish release
    needs:
      - windows
      - android
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download Windows build
        uses: actions/download-artifact@v8
        with:
          name: ShadowPlay-Windows-installer
          path: release-assets/windows

      - name: Download Android build
        uses: actions/download-artifact@v8
        with:
          name: release-android
          path: release-assets/android

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist

          WINDOWS_INSTALLER="$(find release-assets/windows -maxdepth 1 -type f -name 'ShadowPlay-Setup-*.exe' | head -n 1)"
          if [ -z "$WINDOWS_INSTALLER" ]; then
            echo "::error::Windows installer not found"
            exit 1
          fi

          cp "$WINDOWS_INSTALLER" "dist/$(basename "$WINDOWS_INSTALLER")"

          APK_FILE="$(find release-assets/android -type f -name '*.apk' | head -n 1)"
          if [ -z "$APK_FILE" ]; then
            echo "::error::Android APK not found"
            exit 1
          fi

          cp "$APK_FILE" dist/ShadowPlay-Android.apk
          ls -lh dist

      - name: Preserve iOS asset and replace rolling release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view latest >/dev/null 2>&1; then
            if gh release view latest --json assets --jq '.assets[].name' | grep -Fxq 'ShadowPlay.ipa'; then
              gh release download latest \
                --pattern 'ShadowPlay.ipa' \
                --dir dist

              test -s dist/ShadowPlay.ipa
            fi

            gh release delete latest --cleanup-tag --yes
          elif gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/latest" >/dev/null 2>&1; then
            gh api \
              --method DELETE \
              "repos/$GITHUB_REPOSITORY/git/refs/tags/latest"
          fi

      - name: Create rolling latest release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          overwrite_files: true
          preserve_order: true
          tag_name: latest
          target_commitish: ${{ github.sha }}
          name: ShadowPlay (Latest Build)
          body: |
            Automated latest build from `main` commit `${{ github.sha }}`.

            ## Downloads

            - **Windows Desktop:** `ShadowPlay-Setup-${{ needs.windows.outputs.version }}.exe`
            - **Android:** `ShadowPlay-Android.apk`
            - **iOS OTA / Ad Hoc:** `ShadowPlay.ipa`

            The signed iOS build can only be installed on devices included in its provisioning profile.
          draft: false
          prerelease: true
          make_latest: false
          generate_release_notes: false

      - name: Verify rolling latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          ASSETS="$(gh release view latest --json assets --jq '.assets[].name')"
          printf '%s\n' "$ASSETS"

          grep -Fxq "ShadowPlay-Setup-${{ needs.windows.outputs.version }}.exe" <<<"$ASSETS"
          grep -Fxq "ShadowPlay-Android.apk" <<<"$ASSETS"

          if [ -f dist/ShadowPlay.ipa ]; then
            grep -Fxq "ShadowPlay.ipa" <<<"$ASSETS"
          fi

          if grep -Fxq "ShadowPlay-win-x64.zip" <<<"$ASSETS" || \
             grep -Fxq "ShadowPlay-Android-debug.apk" <<<"$ASSETS"; then
            echo "::error::The rolling release still contains superseded assets"
            exit 1
          fi

          RELEASE_SHA="$(
            gh api \
              "repos/$GITHUB_REPOSITORY/git/ref/tags/latest" \
              --jq '.object.sha'
          )"

          if [ "$RELEASE_SHA" != "$GITHUB_SHA" ]; then
            echo "::error::latest points to $RELEASE_SHA instead of $GITHUB_SHA"
            exit 1
          fi

          PRERELEASE="$(gh release view latest --json isPrerelease --jq '.isPrerelease')"
          PUBLISHED_AT="$(gh release view latest --json publishedAt --jq '.publishedAt')"
          PUBLISHED_AGE_SECONDS="$(($(date +%s) - $(date -d "$PUBLISHED_AT" +%s)))"

          if [ "$PRERELEASE" != "true" ]; then
            echo "::error::latest is not marked as a prerelease"
            exit 1
          fi

          if [ "$PUBLISHED_AGE_SECONDS" -lt 0 ] || [ "$PUBLISHED_AGE_SECONDS" -gt 900 ]; then
            echo "::error::latest was not freshly published: $PUBLISHED_AT"
            exit 1
          fi

      - name: Create or update versioned GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          overwrite_files: true
          preserve_order: true
          draft: false
          prerelease: false
          generate_release_notes: true

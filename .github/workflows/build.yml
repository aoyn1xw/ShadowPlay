name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  windows:
    name: Windows exe (win-x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore ShadowPlay.sln

      - name: Build (Release)
        run: dotnet build ShadowPlay.sln -c Release --no-restore

      - name: Test (.NET unit & integration tests)
        run: dotnet test ShadowPlay.sln -c Release --no-build

      - name: Publish win-x64
        run: dotnet publish src/ShadowPlay.Windows/ShadowPlay.Windows.csproj -c Release -r win-x64 --self-contained false -o publish/win-x64

      - name: Smoke test (headless)
        shell: pwsh
        run: |
          $clips = Join-Path $env:RUNNER_TEMP "smoke-clips"
          New-Item -ItemType Directory -Force -Path $clips | Out-Null
          $bytes = New-Object byte[] 40960
          (New-Object Random 1).NextBytes($bytes)
          [IO.File]::WriteAllBytes((Join-Path $clips "clip_a.mp4"), $bytes)
          [IO.File]::WriteAllBytes((Join-Path $clips "clip_b.mp4"), $bytes[0..8191])

          $out = & ".\publish\win-x64\ShadowPlay.exe" --smoke --folder $clips --port 0 --smoke-seconds 12 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { throw "smoke run exited with $LASTEXITCODE" }
          if ($out -notmatch 'SMOKE_OK') { throw "health never became ready" }
          if ($out -notmatch '"clips":2') { throw "expected 2 clips to be detected" }

      - uses: actions/upload-artifact@v4
        with:
          name: ShadowPlay-win-x64
          path: publish/win-x64/
          if-no-files-found: error

  flutter-android:
    name: Flutter Android (debug APK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true

      - name: Precache Android artifacts
        run: flutter precache --android

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test (unit & widget tests)
        run: flutter test

      - name: Build Android debug APK
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: ShadowPlay-Flutter-android-debug
          path: flutter/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  flutter-ios:
    name: Flutter iOS (unsigned)
    runs-on: macos-15
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true

      - name: Precache iOS artifacts
        run: flutter precache --ios

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test (unit & widget tests)
        run: flutter test

      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          APP_PATH=$(find build/ios -name "Runner.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Runner.app not found in build/ios"
            find build -maxdepth 4
            exit 1
          fi
          echo "Found app bundle at: $APP_PATH"
          rm -rf build/ios/unsigned-ipa
          mkdir -p build/ios/unsigned-ipa/Payload
          cp -R "$APP_PATH" build/ios/unsigned-ipa/Payload/
          cd build/ios/unsigned-ipa
          zip -qry ../ShadowPlay-Flutter-ios-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ShadowPlay-Flutter-ios-unsigned
          path: flutter/build/ios/ShadowPlay-Flutter-ios-unsigned.ipa
          if-no-files-found: error

  release:
    name: Publish Release Assets
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: [windows, flutter-android, flutter-ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: ShadowPlay-win-x64
          path: release-assets/win-x64

      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: ShadowPlay-Flutter-android-debug
          path: release-assets/android

      - name: Download iOS artifact
        uses: actions/download-artifact@v4
        with:
          name: ShadowPlay-Flutter-ios-unsigned
          path: release-assets/ios

      - name: Prepare release files
        run: |
          mkdir -p dist
          # Package Windows executable and DLLs
          cd release-assets/win-x64
          zip -qry ../../dist/ShadowPlay-win-x64.zip .
          cd ../..
          # Copy Android APK
          cp release-assets/android/app-debug.apk dist/ShadowPlay-Android-debug.apk
          # Copy iOS IPA
          cp release-assets/ios/ShadowPlay-Flutter-ios-unsigned.ipa dist/ShadowPlay-iOS-unsigned.ipa
          ls -lh dist

      - name: Create or Update Tagged Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: false
          prerelease: false
          generate_release_notes: true

      - name: Update Rolling Release (Latest from main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rolling
          name: ShadowPlay (Latest Rolling Build)
          body: |
            Automated latest build from `main` commit ${{ github.sha }}.
            
            ### Included Packages:
            - **Windows Desktop App**: `ShadowPlay-win-x64.zip`
            - **Android App**: `ShadowPlay-Android-debug.apk`
            - **iOS App**: `ShadowPlay-iOS-unsigned.ipa`
          files: dist/*
          prerelease: true


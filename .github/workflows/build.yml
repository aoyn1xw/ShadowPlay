name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  windows:
    name: Windows exe (win-x64)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore ShadowPlay.sln

      - name: Build
        run: dotnet build ShadowPlay.sln -c Release --no-restore

      - name: Test
        run: dotnet test ShadowPlay.sln -c Release --no-build

      - name: Publish win-x64
        run: >
          dotnet publish
          src/ShadowPlay.Windows/ShadowPlay.Windows.csproj
          -c Release
          -r win-x64
          --self-contained false
          -o publish/win-x64

      - name: Smoke test
        shell: pwsh
        run: |
          $clips = Join-Path $env:RUNNER_TEMP "smoke-clips"
          New-Item -ItemType Directory -Force -Path $clips | Out-Null

          $bytes = New-Object byte[] 40960
          (New-Object Random 1).NextBytes($bytes)

          [IO.File]::WriteAllBytes(
            (Join-Path $clips "clip_a.mp4"),
            $bytes
          )

          [IO.File]::WriteAllBytes(
            (Join-Path $clips "clip_b.mp4"),
            $bytes[0..8191]
          )

          $out = & ".\publish\win-x64\ShadowPlay.exe" `
            --smoke `
            --folder $clips `
            --port 0 `
            --smoke-seconds 12 |
            Out-String

          Write-Host $out

          if ($LASTEXITCODE -ne 0) {
            throw "smoke run exited with $LASTEXITCODE"
          }

          if ($out -notmatch 'SMOKE_OK') {
            throw "health never became ready"
          }

          if ($out -notmatch '"clips":2') {
            throw "expected 2 clips to be detected"
          }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShadowPlay-win-x64
          path: publish/win-x64/
          if-no-files-found: error


  flutter-android:
    name: Flutter Android
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: flutter

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true

      - name: Precache Android artifacts
        run: flutter precache --android

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShadowPlay-Flutter-android-debug
          path: flutter/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error


  flutter-ios-pr:
    name: Flutter iOS compile check
    if: github.event_name == 'pull_request'
    runs-on: macos-15

    defaults:
      run:
        working-directory: flutter

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true

      - name: Precache iOS artifacts
        run: flutter precache --ios

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign


  ios-signed:
    name: Flutter iOS signed IPA
    if: github.event_name != 'pull_request'
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true

      - name: Install signing files
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISION_BASE64: ${{ secrets.PROVISION_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "${P12_BASE64:-}" ]; then
            echo "::error::P12_BASE64 is missing"
            exit 1
          fi

          if [ -z "${P12_PASSWORD:-}" ]; then
            echo "::error::P12_PASSWORD is missing"
            exit 1
          fi

          if [ -z "${PROVISION_BASE64:-}" ]; then
            echo "::error::PROVISION_BASE64 is missing"
            exit 1
          fi

          CERTIFICATE_PATH="$RUNNER_TEMP/original.p12"
          NORMALIZED_P12="$RUNNER_TEMP/signing.p12"
          CERTIFICATE_PEM="$RUNNER_TEMP/signing.pem"

          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"

          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"

          EXPORT_OPTIONS="$RUNNER_TEMP/ExportOptions.plist"
          ARCHIVE_PATH="$RUNNER_TEMP/ShadowPlay.xcarchive"
          EXPORT_PATH="$RUNNER_TEMP/export"

          export CERTIFICATE_PATH
          export PROFILE_PATH
          export P12_BASE64
          export PROVISION_BASE64

          python3 <<'PY'
          import base64
          import os

          with open(os.environ["CERTIFICATE_PATH"], "wb") as f:
              f.write(
                  base64.b64decode(
                      os.environ["P12_BASE64"].strip()
                  )
              )

          with open(os.environ["PROFILE_PATH"], "wb") as f:
              f.write(
                  base64.b64decode(
                      os.environ["PROVISION_BASE64"].strip()
                  )
              )
          PY

          if [ ! -s "$CERTIFICATE_PATH" ]; then
            echo "::error::Decoded certificate is empty"
            exit 1
          fi

          if [ ! -s "$PROFILE_PATH" ]; then
            echo "::error::Decoded provisioning profile is empty"
            exit 1
          fi

          if openssl pkcs12 \
            -in "$CERTIFICATE_PATH" \
            -passin "pass:$P12_PASSWORD" \
            -info \
            -noout
          then
            PKCS12_LEGACY=""
          else
            echo "Trying PKCS12 legacy mode"

            openssl pkcs12 \
              -legacy \
              -in "$CERTIFICATE_PATH" \
              -passin "pass:$P12_PASSWORD" \
              -info \
              -noout

            PKCS12_LEGACY="-legacy"
          fi

          openssl pkcs12 \
            $PKCS12_LEGACY \
            -in "$CERTIFICATE_PATH" \
            -passin "pass:$P12_PASSWORD" \
            -nodes \
            -out "$CERTIFICATE_PEM"

          openssl pkcs12 \
            -export \
            -in "$CERTIFICATE_PEM" \
            -out "$NORMALIZED_P12" \
            -passout "pass:$P12_PASSWORD"

          security create-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security set-keychain-settings \
            -lut 21600 \
            "$KEYCHAIN_PATH"

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security import "$NORMALIZED_P12" \
            -k "$KEYCHAIN_PATH" \
            -P "$P12_PASSWORD" \
            -A

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          EXISTING_KEYCHAINS="$(
            security list-keychains -d user |
            tr -d '"' |
            tr '\n' ' '
          )"

          security list-keychains \
            -d user \
            -s "$KEYCHAIN_PATH" $EXISTING_KEYCHAINS

          security default-keychain \
            -d user \
            -s "$KEYCHAIN_PATH"

          security find-identity \
            -v \
            -p codesigning \
            "$KEYCHAIN_PATH"

          CERT_SHA="$(
            security find-identity \
              -v \
              -p codesigning \
              "$KEYCHAIN_PATH" |
            grep '"Apple Distribution:' |
            head -n 1 |
            awk '{print $2}'
          )"

          if [ -z "$CERT_SHA" ]; then
            echo "::error::Apple Distribution identity was not found"
            exit 1
          fi

          security cms \
            -D \
            -i "$PROFILE_PATH" \
            > "$PROFILE_PLIST"

          PROFILE_UUID="$(
            /usr/libexec/PlistBuddy \
              -c "Print :UUID" \
              "$PROFILE_PLIST"
          )"

          PROFILE_NAME="$(
            /usr/libexec/PlistBuddy \
              -c "Print :Name" \
              "$PROFILE_PLIST"
          )"

          TEAM_ID="$(
            /usr/libexec/PlistBuddy \
              -c "Print :TeamIdentifier:0" \
              "$PROFILE_PLIST"
          )"

          APPLICATION_IDENTIFIER="$(
            /usr/libexec/PlistBuddy \
              -c "Print :Entitlements:application-identifier" \
              "$PROFILE_PLIST"
          )"

          BUNDLE_ID="${APPLICATION_IDENTIFIER#${TEAM_ID}.}"

          echo "Profile UUID: $PROFILE_UUID"
          echo "Profile name: $PROFILE_NAME"
          echo "Team ID: $TEAM_ID"
          echo "Bundle ID: $BUNDLE_ID"

          if [ -z "$PROFILE_UUID" ] || \
             [ -z "$PROFILE_NAME" ] || \
             [ -z "$TEAM_ID" ] || \
             [ -z "$BUNDLE_ID" ]; then
            echo "::error::Provisioning profile metadata is incomplete"
            exit 1
          fi

          if [ "$BUNDLE_ID" != "app.winter6686.date9988" ]; then
            echo "::error::Provisioning profile bundle ID does not match"
            exit 1
          fi

          if ! /usr/libexec/PlistBuddy \
            -c "Print :ProvisionedDevices:0" \
            "$PROFILE_PLIST" \
            >/dev/null 2>&1
          then
            echo "::error::Profile is not an Ad Hoc profile"
            exit 1
          fi

          mkdir -p \
            "$HOME/Library/MobileDevice/Provisioning Profiles"

          cp "$PROFILE_PATH" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          cat > "$EXPORT_OPTIONS" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>ad-hoc</string>

              <key>teamID</key>
              <string>$TEAM_ID</string>

              <key>signingStyle</key>
              <string>manual</string>

              <key>signingCertificate</key>
              <string>$CERT_SHA</string>

              <key>provisioningProfiles</key>
              <dict>
                  <key>$BUNDLE_ID</key>
                  <string>$PROFILE_NAME</string>
              </dict>

              <key>stripSwiftSymbols</key>
              <true/>
          </dict>
          </plist>
          EOF

          plutil -lint "$EXPORT_OPTIONS"

          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"
          echo "BUNDLE_ID=$BUNDLE_ID" >> "$GITHUB_ENV"
          echo "CERT_SHA=$CERT_SHA" >> "$GITHUB_ENV"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "EXPORT_OPTIONS=$EXPORT_OPTIONS" >> "$GITHUB_ENV"
          echo "ARCHIVE_PATH=$ARCHIVE_PATH" >> "$GITHUB_ENV"
          echo "EXPORT_PATH=$EXPORT_PATH" >> "$GITHUB_ENV"

          rm -f "$CERTIFICATE_PEM"
          rm -f "$CERTIFICATE_PATH"

      - name: Resolve dependencies
        working-directory: flutter
        run: flutter pub get

      - name: Analyze
        working-directory: flutter
        run: flutter analyze

      - name: Test
        working-directory: flutter
        run: flutter test

      - name: Prepare Flutter iOS build
        working-directory: flutter
        run: |
          set -euo pipefail

          flutter build ios \
            --release \
            --no-codesign

      - name: Configure Runner signing
        working-directory: flutter/ios
        run: |
          set -euo pipefail

          export PROFILE_NAME
          export TEAM_ID
          export BUNDLE_ID
          export CERT_SHA

          ruby <<'RUBY'
          require "xcodeproj"

          project = Xcodeproj::Project.open(
            "Runner.xcodeproj"
          )

          runner = project.targets.find do |target|
            target.name == "Runner"
          end

          abort "Runner target not found" unless runner

          release = runner.build_configurations.find do |config|
            config.name == "Release"
          end

          abort "Runner Release configuration not found" unless release

          settings = release.build_settings

          settings["CODE_SIGN_STYLE"] = "Manual"
          settings["CODE_SIGN_IDENTITY"] = ENV.fetch("CERT_SHA")
          settings["DEVELOPMENT_TEAM"] = ENV.fetch("TEAM_ID")
          settings["PRODUCT_BUNDLE_IDENTIFIER"] = ENV.fetch("BUNDLE_ID")
          settings["PROVISIONING_PROFILE_SPECIFIER"] =
            ENV.fetch("PROFILE_NAME")

          settings.delete("PROVISIONING_PROFILE")

          project.save

          puts "Configured signing for Runner Release only"
          puts "Bundle ID: #{ENV.fetch("BUNDLE_ID")}"
          puts "Team ID: #{ENV.fetch("TEAM_ID")}"
          puts "Profile: #{ENV.fetch("PROFILE_NAME")}"
          RUBY

      - name: Inspect signing settings
        working-directory: flutter/ios
        run: |
          set -euo pipefail

          xcodebuild \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -showBuildSettings |
          grep -E \
            "PRODUCT_BUNDLE_IDENTIFIER|CODE_SIGN_STYLE|CODE_SIGN_IDENTITY|DEVELOPMENT_TEAM|PROVISIONING_PROFILE_SPECIFIER"

      - name: Archive signed iOS app
        working-directory: flutter/ios
        run: |
          set -euo pipefail

          rm -rf "$ARCHIVE_PATH"

          xcodebuild \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE_PATH" \
            archive

      - name: Verify signed archive
        run: |
          set -euo pipefail

          APP_PATH="$ARCHIVE_PATH/Products/Applications/Runner.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "::error::Runner.app was not created"
            exit 1
          fi

          codesign \
            -dvvv \
            "$APP_PATH" \
            2>&1 |
          grep -E \
            "Identifier=|Authority=|TeamIdentifier="

          if [ ! -f "$APP_PATH/embedded.mobileprovision" ]; then
            echo "::error::Archive has no embedded provisioning profile"
            exit 1
          fi

          security cms \
            -D \
            -i "$APP_PATH/embedded.mobileprovision" \
            > "$RUNNER_TEMP/embedded-profile.plist"

          EMBEDDED_UUID="$(
            /usr/libexec/PlistBuddy \
              -c "Print :UUID" \
              "$RUNNER_TEMP/embedded-profile.plist"
          )"

          if [ "$EMBEDDED_UUID" != "$PROFILE_UUID" ]; then
            echo "::error::Wrong provisioning profile was embedded"
            exit 1
          fi

      - name: Export signed IPA
        run: |
          set -euo pipefail

          rm -rf "$EXPORT_PATH"
          mkdir -p "$EXPORT_PATH"

          xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$EXPORT_OPTIONS"

      - name: Stage signed IPA
        run: |
          set -euo pipefail

          IPA_FILE="$(
            find "$EXPORT_PATH" \
              -type f \
              -name "*.ipa" |
            head -n 1
          )"

          if [ -z "$IPA_FILE" ]; then
            echo "::error::No IPA was produced"
            exit 1
          fi

          mkdir -p output

          cp "$IPA_FILE" \
            output/ShadowPlay.ipa

          ls -lh output/ShadowPlay.ipa

      - name: Upload signed iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShadowPlay-signed-iOS
          path: output/ShadowPlay.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Clean up signing files
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ] && \
             [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain \
              "$KEYCHAIN_PATH" \
              || true
          fi

          rm -f "$RUNNER_TEMP/original.p12"
          rm -f "$RUNNER_TEMP/signing.p12"
          rm -f "$RUNNER_TEMP/signing.pem"
          rm -f "$RUNNER_TEMP/profile.mobileprovision"
          rm -f "$RUNNER_TEMP/profile.plist"
          rm -f "$RUNNER_TEMP/embedded-profile.plist"
          rm -f "$RUNNER_TEMP/ExportOptions.plist"


  release:
    name: Publish Release Assets

    if: >
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main'
      )

    needs:
      - windows
      - flutter-android
      - ios-signed

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: ShadowPlay-win-x64
          path: release-assets/win-x64

      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: ShadowPlay-Flutter-android-debug
          path: release-assets/android

      - name: Download signed iOS artifact
        uses: actions/download-artifact@v4
        with:
          name: ShadowPlay-signed-iOS
          path: release-assets/ios

      - name: Prepare release files
        run: |
          set -euo pipefail

          mkdir -p dist

          cd release-assets/win-x64
          zip -qry ../../dist/ShadowPlay-win-x64.zip .
          cd ../..

          APK_FILE="$(
            find release-assets/android \
              -name "*.apk" |
            head -n 1
          )"

          if [ -z "$APK_FILE" ]; then
            echo "::error::Android APK not found"
            exit 1
          fi

          cp "$APK_FILE" \
            dist/ShadowPlay-Android-debug.apk

          IPA_FILE="$(
            find release-assets/ios \
              -name "*.ipa" |
            head -n 1
          )"

          if [ -z "$IPA_FILE" ]; then
            echo "::error::Signed iOS IPA not found"
            exit 1
          fi

          cp "$IPA_FILE" \
            dist/ShadowPlay.ipa

          echo "Release files:"
          ls -lh dist

      - name: Create or update tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: false
          prerelease: false
          generate_release_notes: true

      - name: Create or update latest release
        if: >
          github.ref == 'refs/heads/main' &&
          (
            github.event_name == 'push' ||
            github.event_name == 'workflow_dispatch'
          )
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          Automated latest build from \`main\` commit \`${GITHUB_SHA}\`.

          ### Downloads

          - **Windows Desktop:** \`ShadowPlay-win-x64.zip\`
          - **Android:** \`ShadowPlay-Android-debug.apk\`
          - **iOS OTA / Ad Hoc:** \`ShadowPlay.ipa\`

          The signed iOS build can only be installed on devices included in its provisioning profile.
          EOF

          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest \
              --title "ShadowPlay (Latest Build)" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create latest \
              --title "ShadowPlay (Latest Build)" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --target "$GITHUB_SHA"
          fi

          RELEASE_ID="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/releases/tags/latest" \
              --jq '.id'
          )"

          if [ -z "$RELEASE_ID" ]; then
            echo "::error::Could not resolve the latest release id"
            exit 1
          fi

          for file in dist/*; do
            asset_name="$(basename "$file")"

            uploaded=false
            for attempt in 1 2 3; do
              # Delete matching assets explicitly before every attempt. This
              # avoids a GitHub API 422 when a previous attempt or run left
              # an asset with the same name.
              gh api --paginate \
                "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?per_page=100" \
                --jq ".[] | select(.name == \"${asset_name}\") | .id" |
              while IFS= read -r asset_id; do
                if [ -n "$asset_id" ]; then
                  gh api \
                    --method DELETE \
                    "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
                fi
              done

              if gh release upload latest "$file"; then
                uploaded=true
                break
              fi

              if [ "$attempt" -lt 3 ]; then
                sleep "$((attempt * 2))"
              fi
            done

            if [ "$uploaded" != true ]; then
              echo "::error::Failed to upload release asset: ${asset_name}"
              exit 1
            fi
          done

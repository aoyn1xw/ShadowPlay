name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows exe (win-x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore ShadowPlay.sln

      - name: Build (Release)
        run: dotnet build ShadowPlay.sln -c Release --no-restore

      - name: Test
        run: dotnet test ShadowPlay.sln -c Release --no-build

      - name: Publish win-x64
        run: dotnet publish src/ShadowPlay.Windows/ShadowPlay.Windows.csproj -c Release -r win-x64 --self-contained false -o publish/win-x64

      - name: Smoke test (headless)
        shell: pwsh
        run: |
          $clips = Join-Path $env:RUNNER_TEMP "smoke-clips"
          New-Item -ItemType Directory -Force -Path $clips | Out-Null
          $bytes = New-Object byte[] 40960
          (New-Object Random 1).NextBytes($bytes)
          [IO.File]::WriteAllBytes((Join-Path $clips "clip_a.mp4"), $bytes)
          [IO.File]::WriteAllBytes((Join-Path $clips "clip_b.mp4"), $bytes[0..8191])

          $out = & ".\publish\win-x64\ShadowPlay.exe" --smoke --folder $clips --port 0 --smoke-seconds 12 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { throw "smoke run exited with $LASTEXITCODE" }
          if ($out -notmatch 'SMOKE_OK') { throw "health never became ready" }
          if ($out -notmatch '"clips":2') { throw "expected 2 clips to be detected" }

      - uses: actions/upload-artifact@v4
        with:
          name: ShadowPlay-win-x64
          path: publish/win-x64/
          if-no-files-found: error

  ios:
    name: iOS ipa (unsigned, macOS runner)
    # macos-15 ships modern Xcodes that read current project formats.
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      # Make the toolchain explicit instead of relying on the runner default,
      # which can drift independently of our generator.
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      # Pin the generator so the emitted .xcodeproj format is deterministic.
      # Recent XcodeGen releases emit objectVersion 77 (Xcode 16.3+ format),
      # which broke archives on runners with older Xcode. 2.45.0 emits <= 60,
      # readable by every Xcode we target.
      - name: Install pinned XcodeGen
        run: |
          curl -fsSL -o /tmp/xcodegen.zip https://github.com/yonaskolb/XcodeGen/releases/download/2.45.0/xcodegen.zip
          rm -rf /tmp/xcodegen-tmp && unzip -q /tmp/xcodegen.zip -d /tmp/xcodegen-tmp
          sudo mkdir -p /usr/local/bin
          sudo mv /tmp/xcodegen-tmp/xcodegen/bin/xcodegen /usr/local/bin/xcodegen
          chmod +x /usr/local/bin/xcodegen
          echo "xcodegen $(xcodegen --version)"

      # The repo commits project.yml only; the .xcodeproj is generated.
      - name: Generate Xcode project
        run: |
          xcodegen generate
          test -d ShadowPlay.xcodeproj

      # Tripwire: fail here with a clear message if the generator ever starts
      # emitting a project format newer than Xcode 15 understands.
      - name: Verify project format compatibility
        run: |
          version_line=$(grep -m1 'objectVersion' ShadowPlay.xcodeproj/project.pbxproj)
          echo "$version_line"
          version=$(echo "$version_line" | tr -dc '0-9')
          if [ -z "$version" ] || [ "$version" -gt 60 ]; then
            echo "::error::Generated project format ($version) is newer than Xcode 15 supports."
            echo "::error::Pin XcodeGen to a release whose bundled XcodeProj emits objectVersion <= 60."
            exit 1
          fi

      # Unsigned device archive: installable after re-signing (AltStore, Sideloadly,
      # Xcode with a free dev account). See docs/IOS_HANDOFF.md.
      - name: Archive (Release, generic iOS device)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project ShadowPlay.xcodeproj \
            -scheme ShadowPlay \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ShadowPlay.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" | tail -n 40

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -R "build/ShadowPlay.xcarchive/Products/Applications/ShadowPlay.app" build/Payload/
          cd build
          zip -qry ShadowPlay-unsigned.ipa Payload
          ls -lh ShadowPlay-unsigned.ipa

      # Convenience artifact for quick smoke checks without signing.
      - name: Build simulator app
        run: |
          set -o pipefail
          xcodebuild build \
            -project ShadowPlay.xcodeproj \
            -scheme ShadowPlay \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/sim \
            CODE_SIGNING_ALLOWED=NO | tail -n 20
          cd build/sim/Build/Products/Debug-iphonesimulator
          zip -qry "$GITHUB_WORKSPACE/ios/build/ShadowPlay-simulator.zip" ShadowPlay.app

      - uses: actions/upload-artifact@v4
        with:
          name: ShadowPlay-ios-unsigned-ipa
          path: ios/build/ShadowPlay-unsigned.ipa
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: ShadowPlay-ios-simulator-app
          path: ios/build/ShadowPlay-simulator.zip
          if-no-files-found: error

version: 2

updates:
  - package-ecosystem: "nuget"
    directories:
      - "/src/ShadowPlay.Api"
      - "/src/ShadowPlay.Core"
      - "/src/ShadowPlay.Windows"
      - "/tests/ShadowPlay.Tests"
    schedule:
      interval: "weekly"
    groups:
      dotnet-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "pub"
    directory: "/flutter"
    schedule:
      interval: "weekly"
    groups:
      flutter-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
